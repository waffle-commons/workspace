; ============================================================================
; OPcache & JIT Configuration for Waffle Framework Development
; ============================================================================
; This file configures PHP's OPcache bytecode cache and JIT compiler
; for the workspace development environment.
;
; Profile: DEVELOPMENT (fast iteration, code revalidation enabled)
; JIT Tier: ASM (most aggressive, experimental)
; ============================================================================

; ============================================================================
; OPcache Base Settings (Required)
; ============================================================================

; Enable OPcache (bytecode cache for web requests)
opcache.enable=1

; Enable OPcache for CLI (command-line PHP execution)
; Allows composer, phpunit, etc. to benefit from caching
opcache.enable_cli=1


; ============================================================================
; OPcache Development Settings
; (Designed for fast iteration with code revalidation)
; ============================================================================

; Validate file timestamps on every request
; When enabled, PHP checks if source files changed before using cached bytecode
; In development, this allows instant code changes without cache invalidation
opcache.validate_timestamps=1

; Revalidation frequency (in seconds)
; 0 = always revalidate on every request (safest for development)
; Non-zero values cache the validation result for N seconds (not recommended in dev)
opcache.revalidate_freq=0


; ============================================================================
; OPcache Memory & Performance Settings
; ============================================================================

; Memory size allocated to OPcache (in megabytes)
; Stores compiled bytecode for all loaded PHP files
; Default: 64M (increased to 128M to handle large monorepo)
opcache.memory_consumption=128

; Maximum number of files that can be cached
; Waffle monorepo has 15 components + workspace app files
; Default: 4096 (increased to 20000 for safety)
opcache.max_accelerated_files=20000

; Enable fast shutdown (reduce RSHUTDOWN phase execution time)
; Slightly faster shutdown sequence without full cleanup
opcache.fast_shutdown=1


; ============================================================================
; OPcache String Interning (Optional Performance)
; ============================================================================

; Reuse string constants found in source code
; Reduces memory usage when many PHP files share same strings
; Default: 4M (reasonable for development)
opcache.interned_strings_buffer=4


; ============================================================================
; JIT Compiler Configuration (PHP 8.5+ ONLY)
; ============================================================================
; The JIT (Just-In-Time) compiler translates PHP bytecode to machine code
; This provides significant performance improvements for CPU-intensive code
; ============================================================================

; JIT Compilation Mode
;
; IMPORTANT: JIT is currently DISABLED (0) in this development environment.
;
; Reason: Xdebug (installed for debugging) is incompatible with JIT.
; PHP shows: "JIT is incompatible with third party extensions that override
; zend_execute_ex(). JIT disabled."
;
; Available options (PHP 8.5+):
;   0 or "disable" = disabled (no JIT compilation)
;   1 or "on"      = tracing JIT (balanced performance, safe)
;   2              = function JIT (simpler, less aggressive)
;   1234           = most aggressive JIT (assembly-level, experimental)
;
; For PRODUCTION without Xdebug, use 1234 for maximum aggressiveness.
; Numeric format CRTO (4-digit code):
;   C = CPU flags (1 = x86 with AVX)
;   R = Register allocation (2 = aggressive)
;   T = Trigger (3 = lower call count)
;   O = Optimization (4 = maximum)
;
; Development Trade-off: Xdebug for debugging > JIT performance optimization
; opcache.jit=0

; JIT Buffer Size (in megabytes)
; Stores compiled machine code from JIT compilation
; Larger buffer = more functions can be JIT-compiled
; Default: 0 (JIT disabled)
; We allocate 128M (same as OPcache heap for balanced development)
; opcache.jit_buffer_size=128M


; ============================================================================
; Optional: Debugging & Monitoring
; ============================================================================
; Uncomment these to enable OPcache statistics output and debugging

; Output OPcache statistics at shutdown (visible in container logs)
; Useful for monitoring cache hit rates during development
; opcache.log_verbosity_level=4

; Enable debugging information (slight performance impact)
; opcache.save_comments=1
; opcache.load_comments=1

