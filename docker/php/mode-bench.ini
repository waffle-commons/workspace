; ============================================================================
; Waffle PHP Profile: BENCHMARK (🚀)
; ============================================================================
; This profile disables Xdebug and enables the high-performance PHP JIT compiler
; for production-parity CPU benchmarking.
; ============================================================================

[xdebug]
; Fully deactivate Xdebug
xdebug.mode=off

[opcache]
; Enable the Just-In-Time (JIT) compiler
; 1234 represents the most aggressive ASM-level JIT compilation
opcache.jit=1234
opcache.jit_buffer_size=128M
