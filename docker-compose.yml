#
# Waffle Framework — Docker Compose pour le développement FrankenPHP.
# Ce fichier orchestre un environnement de dev local simple et performant.
#
services:
  # Service FrankenPHP (serveur web + PHP).
  waffle:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
      target: waffle_dev_base # Utilise le stage dev avec Xdebug.
      args:
        APP_ENV: development
        FRANKEN_VERSION: 1.12.2
        PHP_VERSION: 8
        OS: trixie
    entrypoint: bash /waffle-commons/workspace/docker/docker-entrypoint.sh
    container_name: waffle-dev
    ports:
      # Expose le port 8080 sur l'hôte et 80 dans le conteneur.
      - "8080:80"
      # Expose le port 443 pour HTTPS (optionnel mais recommandé).
      - "8443:443"
    volumes:
      # Monte tout le dossier waffle-commons dans le conteneur pour le live-reload.
      - ..:/waffle-commons
      # Monte le Caddyfile pour la configuration du serveur.
      - ./docker/frankenphp/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Monte la configuration Starship pour le bash.
      - ./docker/term/starship.toml:/home/workspace/.config/starship.toml
      # Monte la configuration OPcache & JIT (lecture seule, éditable à chaud).
      - ./docker/frankenphp/php/opcache.ini:/usr/local/etc/php/conf.d/opcache.ini:ro
      # Monte la configuration du mode PHP actif (debug vs bench).
      - ./docker/php/mode-active.ini:/usr/local/etc/php/conf.d/mode-active.ini:ro
      # Désactive le chargement Xdebug par défaut du Dockerfile.
      - /dev/null:/usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini:ro
    environment:
      # Active HTTPS avec un certificat auto-signé pour le développement local.
      SERVER_NAME: "localhost"
      CADDY_GLOBAL_OPTIONS: "debug"
      XDEBUG_MODE: "debug,coverage"
      # APP_ENV: "dev"
      # APP_DEBUG: "true"
      PHP_IDE_CONFIG: "serverName=waffle-dev"
      # DSN de connexion à l'instance Redis interne.
      # REDIS_DSN: "redis://waffle-redis:6379"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 10s
    networks:
      - waffle-network
    depends_on:
      legacy-backend:
        condition: service_healthy
      waffle-redis:
        # Attendre que l'instance Redis soit saine avant de démarrer.
        condition: service_healthy

  # « Monolithe hérité » factice — un backend délibérément lent et lourd en
  # mémoire que la passerelle EcoShield précède et proxifie de manière
  # transparente. Il tourne sur le serveur PHP intégré (PAS en mode worker
  # FrankenPHP) pour émuler une app PHP-FPM/Nginx classique et bloquante, afin
  # que le contraste avec le proxy PSR-18 non bloquant et borné en mémoire
  # d'EcoShield reste visible de bout en bout.
  legacy-backend:
    image: php:8.5-cli
    container_name: legacy-backend
    working_dir: /app
    # Routeur mono-fichier servi par le serveur intégré ; toute requête est
    # routée par router.php (cf. docker/legacy/public/router.php).
    command: ["php", "-S", "0.0.0.0:80", "/app/router.php"]
    volumes:
      - ./docker/legacy/public:/app:ro
    ports:
      # Accès optionnel depuis l'hôte pour les sondes manuelles : curl http://localhost:8090/api/legacy-heavy
      - "8090:80"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/health') === false ? 1 : 0);"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - waffle-network

  # Instance Redis interne et performante pour le cache et les tokens de sécurité.
  waffle-redis:
    image: redis:7-alpine
    container_name: waffle-redis
    healthcheck:
      # Ping de diagnostic pour valider l'état du serveur Redis.
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - waffle-network

networks:
  waffle-network:
    driver: bridge
