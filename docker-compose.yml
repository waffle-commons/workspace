#
# Waffle Framework — Docker Compose pour le développement FrankenPHP.
# Ce fichier orchestre un environnement de dev local simple et performant.
#
services:
  # Service FrankenPHP (serveur web + PHP).
  waffle:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
      target: waffle_dev_base # Utilise le stage dev avec Xdebug.
      args:
        APP_ENV: development
        FRANKEN_VERSION: 1.12.7
        PHP_VERSION: 8
        OS: trixie
    entrypoint: bash /waffle-commons/workspace/docker/docker-entrypoint.sh
    image: waffle-commons:workspace
    container_name: waffle-dev
    ports:
      # Expose le port 8080 sur l'hôte et 80 dans le conteneur.
      - "8080:80"
      # Expose le port 443 pour HTTPS (optionnel mais recommandé).
      - "8443:443"
    volumes:
      # Monte tout le dossier waffle-commons dans le conteneur pour le live-reload.
      - ..:/waffle-commons
      # Monte le Caddyfile pour la configuration du serveur.
      - ./docker/frankenphp/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Monte la configuration Starship pour le bash.
      - ./docker/term/starship.toml:/home/workspace/.config/starship.toml
      # Monte la configuration OPcache & JIT (lecture seule, éditable à chaud).
      - ./docker/frankenphp/php/opcache.ini:/usr/local/etc/php/conf.d/opcache.ini:ro
      # Monte la configuration du mode PHP actif (debug vs bench).
      - ./docker/php/mode-active.ini:/usr/local/etc/php/conf.d/mode-active.ini:ro
      # Désactive le chargement Xdebug par défaut du Dockerfile.
      - /dev/null:/usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini:ro
    environment:
      # Active HTTPS avec un certificat auto-signé pour le développement local.
      SERVER_NAME: "localhost"
      CADDY_GLOBAL_OPTIONS: "debug"
      XDEBUG_MODE: "debug,coverage"
      # APP_ENV: "dev"
      # APP_DEBUG: "true"
      PHP_IDE_CONFIG: "serverName=waffle-dev"
      # Traçage distribué (AXE 5 / OBS-01) : ce service joue l'AMONT. Il exporte ses spans
      # JSON sur stdout (docker logs) et son endpoint /trace-demo appelle waffle-downstream.
      WAFFLE_TRACING: "otel"
      WAFFLE_SERVICE_NAME: "waffle-upstream"
      # DSN de connexion à l'instance Redis interne.
      # REDIS_DSN: "redis://waffle-redis:6379"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 10s
    networks:
      - waffle-network
    depends_on:
      legacy-backend:
        condition: service_healthy
      waffle-redis:
        # Attendre que l'instance Redis soit saine avant de démarrer.
        condition: service_healthy
      waffle-postgres:
        # Attendre que PostgreSQL soit prêt avant de démarrer l'application.
        condition: service_healthy

  # Service Waffle AVAL de la démo de traçage distribué (AXE 5 / OBS-01). Même image et
  # même code applicatif que `waffle`, mais joué comme service appelé : l'amont l'invoque
  # via http-client (qui injecte le `traceparent` W3C), son TracingMiddleware l'extrait et
  # POURSUIT la même trace. Les deux services exportent leurs spans sur stdout, donc
  # `docker logs waffle-downstream` / `waffle-dev` sert de collecteur. Interne uniquement
  # (aucun port publié vers l'hôte) ; sert en HTTP simple sur :80 du réseau Docker.
  waffle-downstream:
    image: waffle-commons:workspace
    container_name: waffle-downstream
    entrypoint: bash /waffle-commons/workspace/docker/docker-entrypoint.sh
    volumes:
      - ..:/waffle-commons
      - ./docker/frankenphp/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./docker/frankenphp/php/opcache.ini:/usr/local/etc/php/conf.d/opcache.ini:ro
      - ./docker/php/mode-active.ini:/usr/local/etc/php/conf.d/mode-active.ini:ro
      - /dev/null:/usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini:ro
    environment:
      # HTTP simple sur le réseau interne (pas d'auto-HTTPS pour un appel service-à-service).
      SERVER_NAME: ":80"
      XDEBUG_MODE: "off"
      WAFFLE_TRACING: "otel"
      WAFFLE_SERVICE_NAME: "waffle-downstream"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 10s
    networks:
      - waffle-network
    depends_on:
      waffle-redis:
        condition: service_healthy
      waffle-postgres:
        condition: service_healthy

  # « Monolithe hérité » factice — un backend délibérément lent et lourd en
  # mémoire que la passerelle Waffle précède et proxifie de manière
  # transparente. Il tourne sur le serveur PHP intégré (PAS en mode worker
  # FrankenPHP) pour émuler une app PHP-FPM/Nginx classique et bloquante, afin
  # que le contraste avec le proxy PSR-18 non bloquant et borné en mémoire
  # de la passerelle reste visible de bout en bout.
  legacy-backend:
    image: php:8.5-cli@sha256:54d82ff9be6bd198145e90c917fc9b2e24230b42e52def8deb3554baf61c451a
    container_name: legacy-backend
    working_dir: /app
    # Routeur mono-fichier servi par le serveur intégré ; toute requête est
    # routée par router.php (cf. docker/legacy/public/router.php).
    command: ["php", "-S", "0.0.0.0:80", "/app/router.php"]
    environment:
      # Pont d'Authentification Universel (RFC-021 §4.3) : le monolithe reçoit
      # la MÊME valeur de secret que la passerelle pour vérifier la signature
      # HMAC des assertions X-Wfl-Assert-User (interpolée depuis ./.env).
      WAFFLE_AUTH_SECRET: "${WAFFLE_AUTH_SECRET:-}"
    volumes:
      - ./docker/legacy/public:/app:ro
    ports:
      # Accès optionnel depuis l'hôte pour les sondes manuelles : curl http://localhost:8090/api/legacy-heavy
      - "8090:80"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/health') === false ? 1 : 0);"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - waffle-network

  # Instance Redis interne et performante pour le cache et les tokens de sécurité.
  # Le port 6379 est aussi exposé sur l'hôte pour les sondes manuelles (redis-cli)
  # et les serveurs MCP exécutés sur l'hôte (cf. ../MCP.md).
  waffle-redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    container_name: waffle-redis
    ports:
      - "6379:6379"
    healthcheck:
      # Ping de diagnostic pour valider l'état du serveur Redis.
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - waffle-network

  # Base de données PostgreSQL — bac à sable de persistance (RFC-022).
  # L'application s'y connecte via le nom de service (DB_HOST=waffle-postgres) ;
  # le port 5432 est aussi exposé sur l'hôte pour les sondes manuelles (psql, IDE).
  waffle-postgres:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    container_name: waffle-postgres
    environment:
      # Identifiants de développement local (résolus depuis .env) —
      # surchargés par l'orchestrateur en production.
      POSTGRES_DB: "${DB_NAME:-waffle}"
      POSTGRES_USER: "${DB_USER:-waffle}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-waffle}"
    ports:
      - "5432:5432"
    volumes:
      # Volume nommé : les données survivent aux redémarrages du conteneur.
      - waffle-postgres-data:/var/lib/postgresql/data
    healthcheck:
      # pg_isready valide que le serveur accepte réellement les connexions.
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-waffle} -d ${DB_NAME:-waffle}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - waffle-network

  # Base documentaire MongoDB — bac à sable NoSQL (RFC-022 §4.2).
  # Service indépendant : l'application n'en dépend pas au démarrage ; les tests
  # d'intégration du composant data s'y connectent via le nom de service
  # (waffle-mongo:27017) sur le réseau interne. Le port 27017 est aussi exposé sur
  # l'hôte pour les sondes manuelles (mongosh) et les serveurs MCP exécutés sur
  # l'hôte (cf. ../MCP.md).
  waffle-mongo:
    image: mongo:7@sha256:35a5926f71f8b6cb19206bee928c5a85f241a8be99f20c81abe35ae78a73415d
    container_name: waffle-mongo
    ports:
      - "27017:27017"
    volumes:
      # Volume nommé : les documents survivent aux redémarrages du conteneur.
      - waffle-mongo-data:/data/db
    healthcheck:
      # Ping mongosh pour valider que le serveur répond réellement.
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - waffle-network

  # MySQL 8.4 LTS et MariaDB 11.4 LTS — matrice SQL des migrations (OPS-03, RFC-014).
  # L'application n'en dépend pas ; les tests d'intégration du composant data y
  # rejouent l'aller-retour db:migrate / db:rollback via le nom de service
  # (waffle-mysql:3306, waffle-mariadb:3306) sur le réseau interne. Les ports 3306
  # et 3307 sont aussi exposés sur l'hôte pour les sondes manuelles.
  waffle-mysql:
    image: mysql:8.4@sha256:0f51e63e537a1f176423fa03ef559aabe6fa4372a53160a44bc7e75da7d15364
    container_name: waffle-mysql
    environment:
      # Identifiants de développement local uniquement.
      MYSQL_DATABASE: "${DB_NAME:-waffle}"
      MYSQL_USER: "${DB_USER:-waffle}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-waffle}"
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD:-waffle}"
    ports:
      - "3306:3306"
    volumes:
      - waffle-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    networks:
      - waffle-network

  waffle-mariadb:
    image: mariadb:11.4@sha256:250e1609e93c0e6aecf64bfbab2d84d5e89d2481540fe77447ff6c855c3b1873
    container_name: waffle-mariadb
    environment:
      # Identifiants de développement local uniquement.
      MARIADB_DATABASE: "${DB_NAME:-waffle}"
      MARIADB_USER: "${DB_USER:-waffle}"
      MARIADB_PASSWORD: "${DB_PASSWORD:-waffle}"
      MARIADB_ROOT_PASSWORD: "${DB_PASSWORD:-waffle}"
    ports:
      - "3307:3306"
    volumes:
      - waffle-mariadb-data:/var/lib/mysql
    healthcheck:
      # Script de santé fourni par l'image officielle.
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    networks:
      - waffle-network

networks:
  waffle-network:
    driver: bridge

volumes:
  # Données PostgreSQL persistées entre les redémarrages (bac à sable RFC-022).
  waffle-postgres-data:
  # Documents MongoDB persistés entre les redémarrages (bac à sable RFC-022).
  waffle-mongo-data:
  # Données MySQL et MariaDB persistées entre les redémarrages (matrice OPS-03).
  waffle-mysql-data:
  waffle-mariadb-data:
